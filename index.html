<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Xtrema - PWA Player</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d47a1">
    <link rel="apple-touch-icon" href="https://i.ibb.co/PZRkN7qK/RADIO-XTREMA.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0d47a1;
            --primary-light: #1e88e5;
            --accent: #00e5ff;
            --bg-gradient: linear-gradient(135deg, #0a192f 0%, #0d47a1 50%, #1565c0 100%);
            --card-bg: rgba(255, 255, 255, 0.12);
            --card-border: rgba(255, 255, 255, 0.25);
            --text-light: #ffffff;
            --text-muted: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: var(--text-light);
            padding: 20px 15px;
        }

        /* Container */
        .player-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 30px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            margin: auto;
            position: relative;
            overflow: hidden;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .live-tag {
            background: #ff1744;
            color: white;
            font-weight: bold;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(255, 23, 68, 0.5);
            animation: pulse-red 2s infinite;
        }

        .live-tag::before {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 23, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0); }
        }

        .btn-install {
            background: #ffffff;
            color: var(--primary);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .btn-install:hover {
            background: #e3f2fd;
            transform: translateY(-2px);
        }

        /* Station Logo */
        .logo-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(135deg, #ffffff, var(--accent));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .station-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ffffff;
        }

        /* Title Info */
        .station-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }

        .station-status {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* Audio Visualizer Waves */
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 5px;
            height: 35px;
            margin-bottom: 25px;
        }

        .bar {
            width: 4px;
            height: 8px;
            background: var(--accent);
            border-radius: 4px;
            transition: height 0.2s ease;
        }

        .playing .bar {
            animation: bounce 1.2s infinite ease-in-out alternate;
        }

        .playing .bar:nth-child(1) { animation-delay: 0.1s; }
        .playing .bar:nth-child(2) { animation-delay: 0.3s; }
        .playing .bar:nth-child(3) { animation-delay: 0.5s; }
        .playing .bar:nth-child(4) { animation-delay: 0.2s; }
        .playing .bar:nth-child(5) { animation-delay: 0.4s; }
        .playing .bar:nth-child(6) { animation-delay: 0.6s; }
        .playing .bar:nth-child(7) { animation-delay: 0.1s; }

        @keyframes bounce {
            0% { height: 8px; }
            100% { height: 32px; background: #ffffff; }
        }

        /* Play Button */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .play-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #ffffff;
            color: var(--primary);
            border: none;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            transform: scale(1.08);
            background: #e3f2fd;
        }

        /* Volume Slider */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .volume-container i {
            font-size: 16px;
            color: var(--text-muted);
            width: 20px;
        }

        .volume-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        /* Footer Copyright */
        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.6;
        }

        footer strong {
            color: #ffffff;
            font-weight: 700;
        }

        footer .whatsapp-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #25d366;
            text-decoration: none;
            font-weight: 700;
            margin-top: 4px;
            background: rgba(37, 211, 102, 0.15);
            padding: 4px 12px;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        footer .whatsapp-link:hover {
            background: rgba(37, 211, 102, 0.3);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="header">
            <div class="live-tag">EN VIVO</div>
            <button class="btn-install" id="installBtn" style="display: none;">
                <i class="fa-solid fa-download"></i> Instalar App
            </button>
        </div>

        <div class="logo-container">
            <img src="https://i.ibb.co/PZRkN7qK/RADIO-XTREMA.jpg" alt="Radio Xtrema" class="station-logo">
        </div>

        <h1 class="station-title">Radio Xtrema</h1>
        <p class="station-status" id="statusText">Toca el botón para escuchar</p>

        <div class="visualizer" id="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div class="controls">
            <button class="play-btn" id="playBtn">
                <i class="fa-solid fa-play" id="playIcon"></i>
            </button>
        </div>

        <div class="volume-container">
            <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
        </div>
    </div>

    <footer>
        <p>Diseñado por <strong>DJ WILMER</strong></p>
        <a href="https://wa.me/51980634177" target="_blank" class="whatsapp-link">
            <i class="fa-brands fa-whatsapp"></i> CONTACTOS: 980634177
        </a>
    </footer>

    <audio id="audioPlayer" src="https://stream-177.surfernetwork.com/vv557vfe21zuv" preload="none"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const visualizer = document.getElementById('visualizer');
        const statusText = document.getElementById('statusText');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        const installBtn = document.getElementById('installBtn');

        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    playIcon.className = 'fa-solid fa-pause';
                    visualizer.classList.add('playing');
                    statusText.textContent = 'Transmitiendo en directo...';
                }).catch(err => {
                    statusText.textContent = 'Error al reproducir audio';
                    console.error(err);
                });
            } else {
                audio.pause();
                isPlaying = false;
                playIcon.className = 'fa-solid fa-play';
                visualizer.classList.remove('playing');
                statusText.textContent = 'En pausa';
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            audio.volume = val;
            if (val == 0) {
                volumeIcon.className = 'fa-solid fa-volume-xmark';
            } else if (val < 0.5) {
                volumeIcon.className = 'fa-solid fa-volume-low';
            } else {
                volumeIcon.className = 'fa-solid fa-volume-high';
            }
        });

        // PWA Installation
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });

        installBtn.addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        installBtn.style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('Service Worker error:', err);
                });
            });
        }
    </script>
</body>
</html>
